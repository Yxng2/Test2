  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            brand: { 50:'#fefbeb',100:'#fef3c7',200:'#fde58a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b',600:'#d97706',700:'#b45309',800:'#92400e',900:'#78350f' },
            darkbg: '#0B0F19', darkcard: '#151B2C', darkborder: '#222B45'

        }
      }

  </script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .dark ::-webkit-scrollbar-thumb { background: #475569; }
    .glass { background: rgba(255,255,255,0.7); backdrop-filter: blur(12px); }
    .dark .glass { background: rgba(21,27,44,0.7); }
    .balance-blur { filter: blur(5px); cursor: pointer; transition: filter 0.2s ease; }
    .balance-blur:hover { filter: blur(3px); }
    input:focus, select:focus, textarea:focus {
      color: #f59e0b;
      caret-color: #f59e0b;
    }
    .dark input:focus, .dark select:focus, .dark textarea:focus {
      color: #fbbf24;
      caret-color: #fbbf24;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-darkbg dark:text-slate-100 min-h-screen flex flex-col antialiased">

  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Custom Confirmation Modal -->
  <div id="custom-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-md w-full p-6 shadow-2xl scale-95 transition-transform duration-200" id="modal-content">
      <h3 id="modal-title" class="text-xl font-bold mb-2">Modal Title</h3>
      <p id="modal-text" class="text-slate-500 dark:text-slate-400 mb-6">Modal descriptive message.</p>
      <div class="flex justify-end gap-3">
        <button id="modal-cancel-btn" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl font-semibold text-sm transition-colors">Cancel</button>
        <button id="modal-confirm-btn" class="px-4 py-2 bg-brand-500 hover:bg-brand-600 text-slate-950 rounded-xl font-bold text-sm transition-colors">Confirm</button>
      </div>
    </div>
  </div>

  <!-- PIN Modal -->
  <div id="pin-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="text-center mb-4">
        <div class="w-12 h-12 bg-brand-500/20 rounded-full flex items-center justify-center mx-auto mb-3">
          <i data-lucide="shield" class="w-6 h-6 text-brand-500"></i>
        </div>
        <h3 class="text-xl font-bold">Transaction PIN Required</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Enter your secure PIN to authorize this transaction</p>
      </div>
      <div class="mb-4">
        <input type="password" id="pin-input" maxlength="6" placeholder="••••••" class="w-full text-center text-2xl tracking-widest bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-4 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-mono">
      </div>
      <div class="flex gap-3">
        <button id="pin-cancel-btn" class="flex-1 px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl font-semibold text-sm transition-colors">Cancel</button>
        <button id="pin-confirm-btn" class="flex-1 px-4 py-2 bg-brand-500 hover:bg-brand-600 text-slate-950 rounded-xl font-bold text-sm transition-colors">Verify PIN</button>

  <!-- Transaction Details Modal -->

            <i data-lucide="users" class="w-6 h-6"></i>

  <!-- Generated Link Result Modal -->
  <div id="link-result-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-lg w-full p-6 shadow-2xl">

        <div class="w-12 h-12 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-3">

        <button onclick="copyGeneratedLink()" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-colors">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Copy Link
        </button>
        <button onclick="document.getElementById('link-result-modal').classList.add('hidden')" class="flex-1 py-2.5 bg-brand-500 hover:bg-brand-600 text-slate-950 rounded-xl text-xs font-black transition-colors">
          Done

    </div>
  </div>

  <!-- Edit Investor Balance Modal -->
  <div id="edit-balance-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-2xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">Edit Investor Balance</h3>
        <button onclick="document.getElementById('edit-balance-modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <p id="edit-balance-investor-name" class="text-xs text-slate-500 dark:text-slate-400 mb-4"></p>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Amount to Add</label>
          <input type="number" id="edit-balance-amount" min="0" step="0.01" placeholder="500.00" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-bold">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Note (optional)</label>
          <input type="text" id="edit-balance-note" placeholder="Deposit confirmation" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
        </div>
        <button onclick="confirmEditBalance()" class="w-full bg-brand-500 hover:bg-brand-600 py-3 rounded-xl text-slate-950 font-black text-sm">
          Confirm & Credit Investor
        </button>
      </div>
    </div>
  </div>

  <!-- MAIN SPA WRAPPER -->
  <div id="app-root" class="flex-grow flex flex-col"></div>

  <script>

    const initialSeedData = {

          twoFactorEnabled: false, transactionPin: '1234', isInvestor: false
        }
      ],
      wallets: [
        { id: 'w_1', userId: 'user_01', currency: 'USD', balance: 45280.50, pending: 1200.00, primary: true },
        { id: 'w_2', userId: 'user_01', currency: 'EUR', balance: 12450.00, pending: 0.00, primary: false },
        { id: 'w_3', userId: 'user_01', currency: 'GBP', balance: 8300.00, pending: 350.00, primary: false },
        { id: 'w_4', userId: 'user_01', currency: 'JPY', balance: 1450000.00, pending: 0.00, primary: false }
      ],
      transactions: [
        { id: 'TXN-984210', userId: 'user_01', date: '2026-05-18T10:30:00.000Z', type: 'Transfer', senderWallet: 'USD', receiverName: 'Sophia Martinez', receiverBank: 'Santander Bank', receiverCountry: 'Spain', amount: 3500.00, currency: 'EUR', exchangeRate: 0.92, fee: 15.00, status: 'Completed', note: 'Invoice for consulting' },
        { id: 'TXN-871239', userId: 'user_01', date: '2026-05-19T14:15:00.000Z', type: 'Deposit', fundingSource: 'Visa Signature', receiverName: 'Self', receiverBank: 'Apex Card API', receiverCountry: 'US', amount: 5000.00, currency: 'USD', exchangeRate: 1.00, fee: 0.00, status: 'Completed', note: 'Top up' },
        { id: 'TXN-761230', userId: 'user_01', date: '2026-05-20T09:00:00.000Z', type: 'Transfer', senderWallet: 'GBP', receiverName: 'Kenji Sato', receiverBank: 'MUFG Bank', receiverCountry: 'Japan', amount: 1500.00, currency: 'JPY', exchangeRate: 198.50, fee: 12.50, status: 'Pending', note: 'Equipment purchase' },
        { id: 'TXN-120934', userId: 'user_01', date: '2026-05-21T11:45:00.000Z', type: 'Withdrawal', fundingSource: 'Metamask Wallet', receiverName: 'Self', receiverBank: 'Crypto Outflow', receiverCountry: 'Blockchain', amount: 500.00, currency: 'USD', exchangeRate: 1.00, fee: 5.00, status: 'Completed', note: 'Crypto cashout' }
      ],
      notifications: [
        { id: 'n_1', userId: 'user_01', title: 'Security Alert', message: 'Logged in from temporary workspace on Chrome.', read: false, date: '2026-05-21T18:00:00.000Z' },
        { id: 'n_2', userId: 'user_01', title: 'Incoming Transfer Scheduled', message: 'Direct deposit of $1,200 is currently processing.', read: false, date: '2026-05-21T08:00:00.000Z' }
      ],
      virtualCards: [
        { id: 'vc_1', userId: 'user_01', cardholder: 'ALEXANDER WRIGHT', number: '4532 9812 4301 9924', expiry: '09/31', cvv: '413', type: 'VISA', status: 'Active', balance: 5000.00, isFrozen: false }
      ],
      investorLinks: [],
      investorRecords: [],
      investorHoldings: []
    };

    function getDB() {
      const data = localStorage.getItem(DB_NAME);
      if (!data) {
        localStorage.setItem(DB_NAME, JSON.stringify(initialSeedData));
        return JSON.parse(JSON.stringify(initialSeedData));
      }
      const parsed = JSON.parse(data);
      if (!parsed.investorLinks) parsed.investorLinks = [];
      if (!parsed.investorRecords) parsed.investorRecords = [];
      if (!parsed.investorHoldings) parsed.investorHoldings = [];
      return parsed;
    }

    function saveDB(db) { localStorage.setItem(DB_NAME, JSON.stringify(db)); }

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    let state = {
      currentUser: null,
      activePage: 'login',
      db: getDB(),
      notificationsOpen: false,
      activeReceiptTxn: null,
      transferFilters: { search: '', type: 'all', status: 'all', sort: 'desc' },
      balancesHidden: false,
      pendingInvestorLink: null,
      activeInvestorRecord: null,
      generatedLink: null
    };

    const sessionUser = sessionStorage.getItem('APEX_LOGGED_USER');
    if (sessionUser) {
      state.currentUser = JSON.parse(sessionUser);
      state.activePage = state.currentUser.isInvestor ? 'investor-dashboard' : 'dashboard';
    }

    const hashMatch = window.location.hash.match(/invite=([^&]+)/);
    if (hashMatch && !state.currentUser) {
      const linkId = decodeURIComponent(hashMatch[1]);
      const db = getDB();
      const link = db.investorLinks.find(l => l.id === linkId);
      if (link) {
        state.pendingInvestorLink = link;
        state.activePage = 'investor-signup';
      }
    }

    function showToast(title, message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `p-4 mb-3 rounded-xl border flex items-start gap-3 shadow-lg pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 w-80 max-w-full ${
        type === 'success'
          ? 'bg-emerald-50 border-emerald-200 text-emerald-800 dark:bg-emerald-950/30 dark:border-emerald-800 dark:text-emerald-200'
          : type === 'error'
            ? 'bg-rose-50 border-rose-200 text-rose-800 dark:bg-rose-950/30 dark:border-rose-800 dark:text-rose-200'
            : 'bg-amber-50 border-amber-200 text-amber-800 dark:bg-amber-950/30 dark:border-amber-800 dark:text-amber-200'
      }`;
      const icon = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
      toast.innerHTML = `
        <i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <p class="font-bold text-sm leading-tight">${title}</p>
          <p class="text-xs mt-0.5 opacity-90">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      `;
      container.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 5000);
    }

    function triggerModal(title, text, onConfirm) {
      const modal = document.getElementById('custom-modal');
      const modalContent = document.getElementById('modal-content');
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-text').textContent = text;
      modal.classList.remove('hidden');
      setTimeout(() => modalContent.classList.remove('scale-95'), 10);
      const closeFn = () => {
        modalContent.classList.add('scale-95');
        setTimeout(() => modal.classList.add('hidden'), 100);
      };
      document.getElementById('modal-cancel-btn').onclick = closeFn;
      document.getElementById('modal-confirm-btn').onclick = () => { onConfirm(); closeFn(); };
    }

    function triggerPinVerification(onSuccess, transferData = null) {
      const pinModal = document.getElementById('pin-modal');
      const pinInput = document.getElementById('pin-input');
      pinInput.value = '';
      pinModal.classList.remove('hidden');
      const closePinModal = () => { pinModal.classList.add('hidden'); pinInput.value = ''; };
      const verifyPin = () => {
        const enteredPin = pinInput.value;
        const db = getDB();
        const user = db.users.find(u => u.id === state.currentUser.id);
        if (user.transactionPin === enteredPin) {
          closePinModal();
          if (transferData) executeTransfer(transferData);
          else if (onSuccess) onSuccess();
        } else {
          showToast('Invalid PIN', 'The transaction PIN you entered is incorrect.', 'error');
          pinInput.value = '';
          pinInput.focus();
        }
      };
      document.getElementById('pin-confirm-btn').onclick = verifyPin;
      document.getElementById('pin-cancel-btn').onclick = closePinModal;
      pinInput.onkeypress = (e) => { if (e.key === 'Enter') verifyPin(); };
      pinInput.focus();
    }

    function navigateTo(page) {
      state.activePage = page;
      renderApp();
      window.scrollTo(0, 0);
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('dark-mode', isDark ? 'enabled' : 'disabled');
      showToast('Theme Updated', `Switched to ${isDark ? 'Dark' : 'Light'} Mode.`, 'info');
    }

    if (localStorage.getItem('dark-mode') === 'enabled' || (!('dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    const exchangeRates = {
      USD: { USD: 1.00, EUR: 0.92, GBP: 0.81, JPY: 155.60, CAD: 1.37, AUD: 1.51 },
      EUR: { USD: 1.09, EUR: 1.00, GBP: 0.88, JPY: 169.10, CAD: 1.49, AUD: 1.64 },

      JPY: { USD: 0.0064, EUR: 0.0059, GBP: 0.0052, JPY: 1.00, CAD: 0.0088, AUD: 0.0097 }
    };

    function triggerDownloadReceipt(txnId) {
      const db = getDB();
      const txn = db.transactions.find(t => t.id === txnId);
      if (!txn) { showToast('Error', 'Transaction not found.', 'error'); return; }
      state.activeReceiptTxn = txn;
      renderReceiptModal();
    }

    function showTransactionDetails(txn) {
      const modal = document.getElementById('txn-details-modal');
      const content = document.getElementById('txn-details-content');
      const formatDate = (dateStr) => {
        const date = new Date(dateStr);
        return {
          date: date.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }),
          time: date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };
      };
      const dateInfo = formatDate(txn.date);
      content.innerHTML = `
        <div class="space-y-3 divide-y divide-slate-100 dark:divide-darkborder">
          <div class="flex justify-between items-center py-2">
            <span class="text-slate-500 dark:text-slate-400">Transaction ID</span>
            <span class="font-mono font-bold text-brand-600 dark:text-brand-400">${txn.id}</span>
          </div>
          <div class="flex justify-between items-center py-2">
            <span class="text-slate-500 dark:text-slate-400">Date</span>
            <span class="font-medium">${dateInfo.date}</span>
          </div>
          <div class="flex justify-between items-center py-2">
            <span class="text-slate-500 dark:text-slate-400">Time</span>
            <span class="font-medium">${dateInfo.time}</span>
          </div>
          <div class="flex justify-between items-center py-2">
            <span class="text-slate-500 dark:text-slate-400">Type</span>
            <span class="font-bold">${txn.type}</span>
          </div>
          ${txn.type === 'Transfer' ? `
            <div class="flex justify-between items-center py-2"><span class="text-slate-500 dark:text-slate-400">Recipient</span><span class="font-medium">${txn.receiverName}</span></div>
            <div class="flex justify-between items-center py-2"><span class="text-slate-500 dark:text-slate-400">Bank</span><span class="font-medium">${txn.receiverBank}</span></div>
            <div class="flex justify-between items-center py-2"><span class="text-slate-500 dark:text-slate-400">Country</span><span class="font-medium">${txn.receiverCountry}</span></div>
            <div class="flex justify-between items-center py-2"><span class="text-slate-500 dark:text-slate-400">Exchange Rate</span><span class="font-medium">1 ${txn.senderWallet} = ${txn.exchangeRate} ${txn.currency}</span></div>
            <div class="flex justify-between items-center py-2"><span class="text-slate-500 dark:text-slate-400">Fee</span><span class="font-medium text-rose-500">${formatCurrencySymbol(txn.currency)}${txn.fee.toFixed(2)}</span></div>
          ` : `
            <div class="flex justify-between items-center py-2"><span class="text-slate-500 dark:text-slate-400">Source</span><span class="font-medium">${txn.fundingSource || 'Apex Global'}</span></div>
          `}

    function formatBalance(currency, amount) {

      return `${formatCurrencySymbol(currency)}${amount.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    function formatCurrencySymbol(curr) {
      switch(curr) {
        case 'USD': return '$'; case 'EUR': return '€'; case 'GBP': return '£';
        case 'JPY': return '¥'; case 'CAD': return 'C$'; case 'AUD': return 'A$';
        default: return '$';

    function copyGeneratedLink() {
      const el = document.getElementById('generated-link-text');
      if (!el) return;
      const text = el.textContent;
      const input = document.createElement('input');
      input.value = text;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');

      showToast('Copied', 'Invite link copied to clipboard.');

    function confirmEditBalance() {
      const amount = parseFloat(document.getElementById('edit-balance-amount').value);
      const note = document.getElementById('edit-balance-note').value.trim();
      const record = state.activeInvestorRecord;
      if (!record) return;
      if (!amount || amount <= 0) { showToast('Invalid Amount', 'Enter a positive amount.', 'error'); return; }

      const db = getDB();
      const invUser = db.users.find(u => u.id === record.investorUserId);
      if (!invUser) { showToast('Error', 'Investor user not found.', 'error'); return; }

      const wallet = db.wallets.find(w => w.userId === invUser.id && w.currency === record.currency);
      if (wallet) {
        wallet.balance += amount;
      } else {
        db.wallets.push({
          id: `w_${Date.now()}`, userId: invUser.id, currency: record.currency,
          balance: amount, pending: 0, primary: true
        });
      }

      db.investorHoldings.push({
        id: `h_${Date.now()}`,
        investorUserId: invUser.id,
        assetType: record.assetType,
        symbol: record.assetSymbol,
        amount: amount,
        currency: record.currency,
        date: new Date().toISOString()
      });

      db.transactions.push({
        id: `TXN-${Math.floor(100000 + Math.random()*900000)}`,
        userId: invUser.id,
        date: new Date().toISOString(),
        type: 'Deposit',
        fundingSource: `${record.assetSymbol} (${record.assetType})`,
        receiverName: 'Self',
        receiverBank: 'Apex Investor API',
        receiverCountry: 'Global',
        amount: amount,
        currency: record.currency,
        exchangeRate: 1.00,
        fee: 0.00,
        status: 'Completed',
        note: note || 'Investor deposit credited'
      });

      record.totalDeposited = (record.totalDeposited || 0) + amount;
      record.pendingDeposit = 0;
      record.lastUpdated = new Date().toISOString();

      db.notifications.push({
        id: `n_${Date.now()}`,
        userId: invUser.id,
        title: '💰 Balance Added',
        message: `${formatCurrencySymbol(record.currency)}${amount.toLocaleString()} has been credited to your ${record.assetSymbol} ${record.assetType} portfolio.`,
        read: false,
        date: new Date().toISOString()
      });

      db.notifications.push({
        id: `n_${Date.now() + 1}`,
        userId: record.ownerId,
        title: 'Investor Balance Updated',
        message: `You credited ${formatCurrencySymbol(record.currency)}${amount.toLocaleString()} to ${record.investorUsername}.`,
        read: false,
        date: new Date().toISOString()
      });

      saveDB(db);
      document.getElementById('edit-balance-modal').classList.add('hidden');
      showToast('Balance Credited', `${formatCurrencySymbol(record.currency)}${amount.toLocaleString()} added to ${record.investorUsername}.`);
      renderApp();
    }

    function submitInvestorWithdrawal() {
      const amtEl = document.getElementById('wd-amount');
      const addrEl = document.getElementById('wd-address');
      if (!amtEl || !addrEl) return;
      const amt = parseFloat(amtEl.value);
      const addr = addrEl.value.trim();
      if (!amt || amt <= 0) { showToast('Invalid Amount', 'Enter a valid amount.', 'error'); return; }
      if (!addr) { showToast('Missing Address', 'Enter destination address.', 'error'); return; }

      const db = getDB();
      const wallet = db.wallets.find(w => w.userId === state.currentUser.id);
      if (!wallet || wallet.balance < amt) {
        showToast('Insufficient Funds', 'Your balance is too low.', 'error'); return;
      }
      wallet.balance -= amt;
      db.transactions.push({
        id: `TXN-${Math.floor(100000 + Math.random()*900000)}`,
        userId: state.currentUser.id,
        date: new Date().toISOString(),
        type: 'Withdrawal',
        fundingSource: addr,
        receiverName: 'Self',
        receiverBank: 'External Wallet',
        receiverCountry: 'Blockchain',
        amount: amt,
        currency: wallet.currency,
        exchangeRate: 1.00,
        fee: 0.00,
        status: 'Pending',
        note: 'Investor withdrawal request'
      });
      saveDB(db);
      showToast('Withdrawal Submitted', 'Your request is being processed.');
      renderApp();
    }

    function confirmInvestorPayment(record) {
      if (!record) { showToast('Error', 'No investor record linked.', 'error'); return; }
      const amtInput = document.getElementById('inv-deposit-amount');
      const amt = amtInput ? parseFloat(amtInput.value) : NaN;
      if (!amt || amt <= 0) {
        showToast('Missing Amount', 'Please enter the amount you deposited.', 'error');
        return;
      }

      const db = getDB();
      const rec = db.investorRecords.find(r => r.id === record.id);
      if (rec) {
        rec.pendingDeposit = (rec.pendingDeposit || 0) + amt;
        rec.lastUpdated = new Date().toISOString();
      }

      db.notifications.push({
        id: `n_${Date.now()}`,
        userId: record.ownerId,
        title: '💰 Investor Confirmed Payment',
        message: `${record.investorName} (@${record.investorUsername}) confirmed a deposit of ${formatCurrencySymbol(record.currency)}${amt.toLocaleString()} via ${record.assetSymbol} (${record.assetType}). Review and credit their balance.`,
        read: false,
        date: new Date().toISOString()
      });

      saveDB(db);
      showToast('Payment Confirmed', `Your deposit of ${formatCurrencySymbol(record.currency)}${amt.toLocaleString()} has been submitted for review.`);

      const panel = document.getElementById('inv-deposit-panel');
      if (panel) {
        panel.innerHTML = `
          <div class="text-center py-6">
            <div class="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-3">
              <i data-lucide="check-circle" class="w-7 h-7"></i>
            </div>
            <h3 class="font-bold text-base text-white">Payment Confirmed</h3>
            <p class="text-xs text-slate-400 mt-1">Amount: <b class="text-emerald-400">${formatCurrencySymbol(record.currency)}${amt.toLocaleString()}</b></p>
            <p class="text-xs text-slate-500 mt-1">Awaiting balance credit from ${record.ownerName}.</p>
          </div>
        `;
        lucide.createIcons();
      }
    }

    function toggleCardFreeze(cardId) {
      const db = getDB();
      const card = db.virtualCards.find(c => c.id === cardId);
      if (card) {
        card.isFrozen = !card.isFrozen;
        saveDB(db);
        showToast('Card Config Updated', `Card now ${card.isFrozen ? 'Frozen' : 'Active'}.`, 'info');
        renderApp();
      }
    }

    function executeTransfer(transferData) {
      const currentDb = getDB();
      const user = currentDb.users.find(u => u.id === state.currentUser.id);
      const fromWallet = currentDb.wallets.find(w => w.userId === user.id && w.currency === transferData.fromCurr);
      if (!fromWallet || fromWallet.balance < transferData.rawAmt) {
        showToast('Insufficient Funds', `Not enough ${transferData.fromCurr}.`, 'error'); return;
      }
      currentDb.wallets = currentDb.wallets.map(w => {
        if (w.userId === user.id && w.currency === transferData.fromCurr) w.balance -= transferData.rawAmt;
        return w;
      });
      const rate = exchangeRates[transferData.fromCurr]?.[transferData.toCurr] || 1.0;
      const fee = transferData.rawAmt * 0.005;
      const generatedId = `TXN-${Math.floor(100000 + Math.random()*900000)}`;
      const newTxn = {
        id: generatedId, userId: user.id, date: new Date().toISOString(), type: 'Transfer',
        senderWallet: transferData.fromCurr, receiverName: transferData.rName,
        receiverBank: transferData.rBank, receiverCountry: transferData.rCountry,
        amount: transferData.rawAmt, currency: transferData.toCurr,
        exchangeRate: rate, fee, status: 'Completed',
        note: transferData.rNote || 'International transfer'
      };
      currentDb.transactions.push(newTxn);
      currentDb.notifications.push({
        id: `n_${Date.now()}`, userId: user.id, title: 'Transaction Dispatched',
        message: `Transferred ${formatCurrencySymbol(transferData.fromCurr)}${transferData.rawAmt} to ${transferData.rName}.`,
        read: false, date: new Date().toISOString()
      });
      saveDB(currentDb);
      showToast('Transfer Dispatched', `Record ID: ${generatedId}`);
      state.activeReceiptTxn = newTxn;
      navigateTo('dashboard');
      renderReceiptModal();
    }

    function exportLedgerCSV() {
      const db = getDB();
      const txns = db.transactions.filter(t => t.userId === state.currentUser.id);
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "ID,Date,Time,Type,SenderWallet,ReceiverName,ReceiverBank,ReceiverCountry,Amount,Currency,ExchangeRate,Fee,Status,Note\n";
      txns.forEach(t => {
        const date = new Date(t.date);
        csvContent += `"${t.id}","${date.toLocaleDateString()}","${date.toLocaleTimeString()}","${t.type}","${t.senderWallet || ''}","${t.receiverName || ''}","${t.receiverBank || ''}","${t.receiverCountry || ''}","${t.amount}","${t.currency}","${t.exchangeRate}","${t.fee}","${t.status}","${t.note}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `apexglobal_audit_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      showToast('CSV Generated', 'Audit log exported.');
    }

          type: 'line',
          data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May (YTD)'],
            datasets: [{
              label: 'Clearing Outflow',
              data: [8200, 14200, 11000, 19500, 24000],
              borderColor: '#f59e0b',
              backgroundColor: 'rgba(245, 158, 11, 0.05)',

            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' } }, x: { grid: { display: false } } }
          }
        });
      }
      const pieCtx = document.getElementById('holdingsPieChart');
      if (pieCtx && !pieCtx.dataset.initialized) {
        pieCtx.dataset.initialized = '1';
        new Chart(pieCtx.getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: ['USD Vault', 'EUR Vault', 'GBP Vault', 'JPY Vault'],
            datasets: [{ data: [65, 18, 12, 5], backgroundColor: ['#f59e0b', '#4f46e5', '#10b981', '#6366f1'], borderWidth: 0 }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
      }
    }

    function renderSettingsView() {
      const db = getDB();
      const activeUser = db.users.find(u => u.id === state.currentUser.id);
      setTimeout(() => {
        const updateForm = document.getElementById('profile-update-form');
        if (updateForm) {
          updateForm.onsubmit = (e) => {
            e.preventDefault();
            const fullName = document.getElementById('sett-fullname').value.trim();
            const phone = document.getElementById('sett-phone').value.trim();
            const country = document.getElementById('sett-country').value;
            const currentDb = getDB();
            currentDb.users = currentDb.users.map(u => {
              if (u.id === activeUser.id) { u.fullName = fullName; u.phone = phone; u.country = country; }
              return u;
            });
            saveDB(currentDb);
            sessionStorage.setItem('APEX_LOGGED_USER', JSON.stringify(currentDb.users.find(u => u.id === activeUser.id)));
            state.currentUser = currentDb.users.find(u => u.id === activeUser.id);
            showToast('Profile Updated', 'Changes saved.');
            renderApp();
          };
        }
        const pinChangeForm = document.getElementById('pin-change-form');
        if (pinChangeForm) {
          pinChangeForm.onsubmit = (e) => {
            e.preventDefault();
            const currentPin = document.getElementById('current-pin').value;
            const newPin = document.getElementById('new-pin').value;
            const confirmPin = document.getElementById('confirm-pin').value;
            if (activeUser.transactionPin !== currentPin) { showToast('Invalid PIN', 'Current PIN incorrect.', 'error'); return; }
            if (!/^\d{4,6}$/.test(newPin)) { showToast('Invalid PIN', 'New PIN must be 4-6 digits.', 'error'); return; }
            if (newPin !== confirmPin) { showToast('PIN Mismatch', 'PINs do not match.', 'error'); return; }
            const currentDb = getDB();
            currentDb.users = currentDb.users.map(u => { if (u.id === activeUser.id) u.transactionPin = newPin; return u; });
            saveDB(currentDb);
            showToast('PIN Updated', 'Transaction PIN changed successfully.');
            document.getElementById('current-pin').value = '';
            document.getElementById('new-pin').value = '';
            document.getElementById('confirm-pin').value = '';
          };
        }
      }, 50);
      return `
        <div class="max-w-3xl mx-auto space-y-6">
          <div class="text-left">
            <h1 class="text-2xl font-black">Account Security Control</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Control your profile and security settings.</p>
          </div>
          <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 md:p-8 shadow-sm space-y-6">
            <h3 class="font-bold text-base border-b pb-3 dark:border-darkborder">Your Global Parameters</h3>
            <form id="profile-update-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Full Corporate Name</label>
                <input type="text" id="sett-fullname" value="${activeUser.fullName}" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Corporate Phone Number</label>
                <input type="text" id="sett-phone" value="${activeUser.phone}" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Country</label>
                <select id="sett-country" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                  <option value="United States" ${activeUser.country === 'United States' ? 'selected' : ''}>United States</option>
                  <option value="United Kingdom" ${activeUser.country === 'United Kingdom' ? 'selected' : ''}>United Kingdom</option>
                  <option value="Germany" ${activeUser.country === 'Germany' ? 'selected' : ''}>Germany</option>
                  <option value="Japan" ${activeUser.country === 'Japan' ? 'selected' : ''}>Japan</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Assigned Web ID</label>
                <input type="text" value="${activeUser.id}" disabled class="w-full bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 text-sm text-slate-400 cursor-not-allowed">
              </div>
              <div class="md:col-span-2 pt-4">
                <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl text-sm">Commit Changes</button>
              </div>
            </form>
          </div>
          <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm">
            <h3 class="font-bold text-base mb-4">Transaction PIN Settings</h3>
            <form id="pin-change-form" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Current Transaction PIN</label>
                <input type="password" id="current-pin" maxlength="6" placeholder="••••••" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-mono">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">New Transaction PIN</label>
                <input type="password" id="new-pin" maxlength="6" placeholder="••••••" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-mono">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Confirm New PIN</label>
                <input type="password" id="confirm-pin" maxlength="6" placeholder="••••••" required class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-darkborder rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm font-mono">
              </div>
              <button type="submit" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl text-sm">Update Transaction PIN</button>
            </form>
          </div>
          <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl p-6 shadow-sm">
            <h3 class="font-bold text-base mb-4">Sandbox Integrations</h3>
            <div class="flex items-center justify-between p-3.5 bg-slate-50 dark:bg-slate-800 rounded-2xl">
              <div>
                <h4 class="font-bold text-xs">2-Factor Biometric Auth</h4>
                <p class="text-[10px] text-slate-400 mt-0.5">Demand biometrics before dispatches.</p>
              </div>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" id="2fa-toggle" class="sr-only peer" ${activeUser.twoFactorEnabled ? 'checked' : ''} onchange="toggle2FASystem()">
                <div class="w-11 h-6 bg-slate-200 dark:bg-slate-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-brand-500"></div>
              </label>
            </div>
          </div>
        </div>
      `;
    }

    function toggle2FASystem() {
      const db = getDB();
      const activeUser = db.users.find(u => u.id === state.currentUser.id);
      activeUser.twoFactorEnabled = !activeUser.twoFactorEnabled;
      saveDB(db);
      showToast('2FA Status Altered', `2FA ${activeUser.twoFactorEnabled ? 'Activated' : 'Disabled'}.`, 'info');
    }

    function renderReceiptModal() {
      const modalId = 'receipt-modal-overlay';
      let existingModal = document.getElementById(modalId);
      if (existingModal) existingModal.remove();
      const txn = state.activeReceiptTxn;
      if (!txn) return;
      const overlay = document.createElement('div');
      overlay.id = modalId;
      overlay.className = "fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4";
      overlay.innerHTML = `
        <div class="bg-white dark:bg-darkcard border border-slate-200 dark:border-darkborder rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl space-y-6 relative">
          <button onclick="document.getElementById('${modalId}').remove()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
          <div class="text-center space-y-1">
            <div class="w-10 h-10 bg-brand-500 text-slate-950 font-black text-lg rounded-xl flex items-center justify-center mx-auto shadow-md">A</div>
            <h3 class="text-lg font-black mt-3">SWIFT Audit Receipt</h3>
            <p class="text-xs text-slate-400">Electronic verification slip</p>
          </div>
          <div class="border-t border-b border-dashed border-slate-200 dark:border-darkborder py-4 space-y-2.5 text-xs">
            <div class="flex justify-between"><span class="text-slate-400">Record ID</span><span class="font-mono font-bold">${txn.id}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Timestamp</span><span>${new Date(txn.date).toLocaleString()}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Type</span><span>${txn.type}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Recipient</span><span class="font-bold">${txn.type === 'Transfer' ? txn.receiverName : 'Self Settlement'}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Institution</span><span>${txn.type === 'Transfer' ? txn.receiverBank : 'Apex API'}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Exchange</span><span>1 ${txn.senderWallet || 'USD'} = ${txn.exchangeRate} ${txn.currency}</span></div>
            <div class="flex justify-between"><span class="text-slate-400">Fee</span><span>${formatCurrencySymbol(txn.currency || 'USD')}${txn.fee.toFixed(2)}</span></div>
          </div>
          <div class="flex justify-between items-center bg-slate-50 dark:bg-slate-900 p-4 rounded-2xl">
            <span class="text-xs font-bold uppercase">Total Volume</span>
            <span class="text-xl font-black">${formatCurrencySymbol(txn.currency)}${txn.amount.toLocaleString()}</span>
          </div>
          <div class="flex gap-2.5">
            <button onclick="window.print()" class="flex-1 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold rounded-xl flex items-center justify-center gap-1.5">
              <i data-lucide="printer" class="w-4 h-4"></i> Print
            </button>
            <button onclick="document.getElementById('${modalId}').remove()" class="flex-1 py-2.5 bg-brand-500 hover:bg-brand-600 text-slate-950 text-xs font-black rounded-xl">
              Acknowledge
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      lucide.createIcons();
    }

    function togglePasswordVisibility(inputId, btnElement) {
      const input = document.getElementById(inputId);
      const icon = btnElement.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    window.addEventListener('hashchange', () => {
      const hashMatch = window.location.hash.match(/invite=([^&]+)/);
      if (hashMatch && !state.currentUser) {
        const linkId = decodeURIComponent(hashMatch[1]);
        const db = getDB();
        const link = db.investorLinks.find(l => l.id === linkId);
        if (link) {
          state.pendingInvestorLink = link;
          state.activePage = 'investor-signup';
          renderApp();
        }
      }
    });

    window.onload = function() {
      renderApp();
    };
  </script>
</body>
</html>
